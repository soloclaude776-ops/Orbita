<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Órbita</title>
<meta name="description" content="Plataforma con todos nuestros juegos para jugar en el navegador.">
<link rel="icon" type="image/svg+xml" href="/logos/orbita.svg">
<style>
:root{--bg:#07080d;--bg2:#10121b;--card:#151826;--line:rgba(255,255,255,.08);--fg:#f2f3f8;--dim:#9aa0b8;--acc:#ff7a33;--acc2:#7c5cff;--ok:#5fd38d;--warn:#ffb547}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07080d}}
:root[data-theme="dark"]{--bg:#07080d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
/* barra de arriba */
.top{position:sticky;top:0;z-index:20;background:rgba(7,8,13,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;height:64px}
.logo{display:flex;align-items:center;font-weight:900;letter-spacing:.22em;font-size:20px}
.logo img{width:40px;height:40px;margin-right:10px;filter:drop-shadow(0 0 10px rgba(255,122,51,.45))}
.gl{width:38px;height:38px;border-radius:10px;margin-right:10px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.ht{display:flex;align-items:center}
.ht .gl{width:64px;height:64px;border-radius:16px;margin-right:16px}
.body .tt{display:flex;align-items:center;margin-bottom:8px}
.body .tt .s{margin:2px 0 0}
.search{margin-left:auto;display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;width:min(320px,45vw)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;min-width:0}
.search svg{width:16px;height:16px;margin-right:8px;opacity:.6;flex:none}
/* destacado */
.hero{position:relative;margin:22px 0 10px;border-radius:22px;overflow:hidden;min-height:420px;display:flex;align-items:flex-end;background:#1a1220 center/cover no-repeat;border:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,13,.92) 0%,rgba(7,8,13,.6) 45%,rgba(7,8,13,0) 75%),linear-gradient(0deg,rgba(7,8,13,.85),rgba(7,8,13,0) 55%)}
.hero .in{position:relative;padding:34px;max-width:620px}
.kicker{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.hero h1{margin:0;font-size:clamp(34px,6vw,64px);line-height:1;letter-spacing:.04em}
.hero .sub{color:#d5d7e4;font-size:18px;margin:8px 0 12px}
.hero p{color:var(--dim);margin:0 0 20px}
.play{display:inline-flex;align-items:center;background:var(--acc);color:#1b0c05;font-weight:800;border-radius:12px;padding:13px 26px;border:0;font-size:16px;box-shadow:0 10px 30px -10px rgba(255,122,51,.7);transition:transform .15s}
.play:hover,.play:focus{transform:translateY(-2px);outline:none}
.play svg{width:18px;height:18px;margin-right:10px}
.tags span{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:#cfd2e2;margin:0 6px 6px 0}
/* filtros */
.row-h{display:flex;align-items:baseline;margin:34px 0 14px}
.row-h h2{margin:0;font-size:20px}
.row-h small{margin-left:12px;color:var(--dim)}
.chips{margin-left:auto}
.chips button{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;margin:0 0 6px 6px;font-size:13px;color:var(--dim)}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* tarjetas */
.grid{display:flex;flex-wrap:wrap;margin:0 -9px}
.card{width:calc(25% - 18px);margin:0 9px 22px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover,.card:focus-within{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(0,0,0,.8);border-color:rgba(255,255,255,.2)}
.cover{position:relative;padding-top:56.25%;background:#222 center/cover no-repeat}
.cover b{position:absolute;left:14px;bottom:10px;font-size:26px;letter-spacing:.05em;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--acc);color:#1b0c05}
.badge.no{left:auto;right:10px;background:rgba(0,0,0,.7);color:var(--warn)}
.body{padding:14px 14px 16px;display:flex;flex-direction:column;flex:1}
.body h3{margin:0;font-size:17px}
.body .s{color:var(--acc);font-size:13px;margin:2px 0 8px;font-weight:600}
.body p{color:var(--dim);font-size:13.5px;margin:0 0 12px;flex:1}
.body .play{padding:10px 16px;font-size:14px;align-self:flex-start;margin-top:4px}
.empty{color:var(--dim);padding:30px 0}
footer{color:var(--dim);font-size:13px;border-top:1px solid var(--line);margin-top:30px;padding:24px 0 40px}
@media (max-width:1100px){.card{width:calc(33.333% - 18px)}}
@media (max-width:800px){.card{width:calc(50% - 18px)}.hero{min-height:360px}.hero .in{padding:22px}.row-h{flex-wrap:wrap}.chips{margin-left:0;width:100%;margin-top:8px}.chips button{margin:0 6px 6px 0}}
@media (max-width:520px){.card{width:calc(100% - 18px)}.logo span{display:none}.search{width:auto;flex:1;margin-left:14px}.wrap{padding:0 16px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/"><img src="/logos/orbita.svg" alt=""><span id="brand">ÓRBITA</span></a>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Buscar juego…" autocomplete="off"></label>
</div></header>
<main class="wrap">
  <section class="hero" id="hero"><div class="in"><span class="kicker">Cargando…</span></div></section>
  <div id="recent"></div>
  <div class="row-h"><h2>Todos los juegos</h2><small id="count"></small><div class="chips" id="chips"></div></div>
  <div class="grid" id="grid"></div>
</main>
<footer class="wrap" id="foot">Todos los juegos se juegan directo en el navegador: compu, celular o consola. Los que dicen 3D necesitan un navegador con gráficos 3D (WebGL). <a href="/subir" style="color:var(--acc);margin-left:8px">Subir un juego</a></footer>
<script>
(function () {
  var data = { juegos: [] }, filtro = 'Todos', texto = '';
  var ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var hay3D = (function () { try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); } catch (e) { return false; } })();
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function color(id) { var h = 0; for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360; return 'linear-gradient(135deg,hsl(' + h + ',60%,28%),hsl(' + ((h + 60) % 360) + ',55%,14%))'; }
  function fondo(j) { return j.portada ? 'url(' + j.portada + ')' : color(j.id); }
  function ultimos() { try { return JSON.parse(localStorage.getItem('orbita_ultimos') || '[]'); } catch (e) { return []; } }
  function anotar(id) { try { var u = ultimos().filter(function (x) { return x !== id; }); u.unshift(id); localStorage.setItem('orbita_ultimos', JSON.stringify(u.slice(0, 8))); } catch (e) { } }
  function noAnda(j) { return j.motor === '3d' && !hay3D; }
  function tarjeta(j) {
    return '<article class="card"><a href="/' + j.id + '" data-id="' + j.id + '" class="cover" style="background-image:' + fondo(j) + '">' +
      (j.nuevo ? '<span class="badge">NUEVO</span>' : '') + (noAnda(j) ? '<span class="badge no">No anda en este navegador</span>' : '') +
      (j.portada ? '' : '<b>' + esc(j.titulo) + '</b>') + '</a>' +
      '<div class="body"><div class="tt">' + (j.logo ? '<img class="gl" src="' + j.logo + '" alt="">' : '') + '<div><h3>' + esc(j.titulo) + '</h3><div class="s">' + esc(j.sub || '') + '</div></div></div><p>' + esc(j.desc) + '</p>' +
      '<div class="tags">' + (j.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<a class="play" href="/' + j.id + '" data-id="' + j.id + '">' + ICON + 'Jugar</a></div></article>';
  }
  function pintar() {
    var js = data.juegos.filter(function (j) {
      var okF = filtro === 'Todos' || (j.tags || []).indexOf(filtro) >= 0;
      var t = (j.titulo + ' ' + (j.sub || '') + ' ' + j.desc + ' ' + (j.tags || []).join(' ')).toLowerCase();
      return okF && (!texto || t.indexOf(texto) >= 0);
    });
    document.getElementById('grid').innerHTML = js.length ? js.map(tarjeta).join('') : '<div class="empty">No hay juegos con eso.</div>';
    document.getElementById('count').textContent = js.length + (js.length === 1 ? ' juego' : ' juegos');
  }
  function armar() {
    document.getElementById('brand').textContent = data.nombre || 'ÓRBITA';
    document.title = (data.nombre || 'Órbita');
    var d = data.juegos.filter(function (j) { return j.id === data.destacado; })[0] || data.juegos[0];
    if (d) {
      var h = document.getElementById('hero'); h.style.backgroundImage = fondo(d);
      h.innerHTML = '<div class="in"><span class="kicker">' + (d.nuevo ? 'Nuevo · ' : '') + 'Destacado</span><div class="ht">' + (d.logo ? '<img class="gl" src="' + d.logo + '" alt="">' : '') + '<h1>' + esc(d.titulo) + '</h1></div><div class="sub">' + esc(d.sub || '') + '</div><p>' + esc(d.desc) + '</p>' +
        '<div class="tags" style="margin-bottom:18px">' + (d.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
        (noAnda(d) ? '<p style="color:var(--warn)">Este juego es 3D y este navegador no lo puede mostrar.</p>' : '') +
        '<a class="play" href="/' + d.id + '" data-id="' + d.id + '">' + ICON + 'Jugar ahora</a></div>';
    }
    var u = ultimos().map(function (id) { return data.juegos.filter(function (j) { return j.id === id; })[0]; }).filter(Boolean).slice(0, 4);
    document.getElementById('recent').innerHTML = u.length ? '<div class="row-h"><h2>Seguí jugando</h2></div><div class="grid">' + u.map(tarjeta).join('') + '</div>' : '';
    var tags = ['Todos']; data.juegos.forEach(function (j) { (j.tags || []).forEach(function (t) { if (tags.indexOf(t) < 0) tags.push(t); }); });
    document.getElementById('chips').innerHTML = tags.slice(0, 9).map(function (t) { return '<button data-t="' + esc(t) + '" class="' + (t === filtro ? 'on' : '') + '">' + esc(t) + '</button>'; }).join('');
    pintar();
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('[data-id]') : null; if (a) anotar(a.getAttribute('data-id'));
    var b = e.target.closest ? e.target.closest('[data-t]') : null;
    if (b) { filtro = b.getAttribute('data-t'); armar(); }
  });
  document.getElementById('q').addEventListener('input', function (e) { texto = e.target.value.trim().toLowerCase(); pintar(); });
  var x = new XMLHttpRequest(); x.open('GET', '/api/juegos');
  x.onload = function () { try { data = JSON.parse(x.responseText); } catch (e) { } armar(); };
  x.onerror = function () { document.getElementById('hero').innerHTML = '<div class="in"><span class="kicker">Sin conexión</span><h1>No se pudo cargar</h1><p>Revisá internet y recargá la página.</p></div>'; };
  x.send();
})();
</script>
</body>
</html>
